<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Dalam Pengembangan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { color: #007bff; margin-bottom: 10px; }
        p { color: #666; font-size: 1.1em; }
        .icon { font-size: 50px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🛠️</div>
    <h1>Mohon Maaf</h1>
    <p>Halaman yang Anda tuju saat ini sedang dalam masa pengembangan dan perbaikan. Silakan kembali lagi nanti!</p>
</div>

</body>
</html>
