<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Dalam Pengembangan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            position: relative;
        }
        .container {
            max-width: 500px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { color: #007bff; margin-bottom: 10px; }
        p { color: #666; font-size: 1.1em; line-height: 1.6; margin-bottom: 15px; }
        .icon { font-size: 50px; margin-bottom: 20px; }
        
        .by-team {
            font-size: 1.1em;
            color: #555;
            font-weight: 500;
            margin-top: 10px;
            margin-bottom: 25px; /* Memberi ruang sebelum tombol */
        }

        /* Style Baru untuk Tombol Kembali */
        .btn-kembali {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-kembali:hover {
            background-color: #0056b3;
        }
        .btn-kembali:active {
            transform: scale(0.98);
        }
        
        /* Style Copyright */
        .footer-copyright {
            position: absolute;
            bottom: 58px;
            left: 20px;
            font-size: 1.1em;
            color: #007bff;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🛠️</div>
    <h1>Mohon Maaf</h1>
    <p>Halaman yang Anda tuju saat ini sedang dalam masa pengembangan dan perbaikan. Mohon doa dan dukungan nya, silahkan kembali lagi nanti.!</p>
    
    <div class="by-team">Bid. Aset Konawe 2026</div>

    <!-- Tombol Kembali Menuju Taplink -->
    <a href="https://asetkonawe.taplink.id/" class="btn-kembali">Kembali ke Halaman Utama</a>
</div>

<!-- Hak Cipta di Pojok Kiri Bawah -->
<div class="footer-copyright">
    Copyright © 2026 Irman_Aset. All rights reserved
</div>

</body>
</html>
